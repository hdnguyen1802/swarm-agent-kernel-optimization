[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sako"
version = "0.1.0"
description = "Swarm Agent Kernel Optimization: measured Triton search for model inference."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["textual>=8.2,<9", "filelock>=3.13,<4"]
colab = ["google-colab-cli==0.7.5"]
gpu = ["torch==2.5.1", "transformers==4.48.3", "numpy==1.26.4", "accelerate==1.3.0", "sentencepiece==0.2.3", "protobuf==7.36.2"]
agent = ["google-genai>=2.34.0,<3", "google-auth>=2.0,<3"]

[project.scripts]
sako = "sako.cli:main"

[tool.setuptools.packages.find]
include = ["sako*"]

[tool.setuptools.package-data]
sako = ["prompts/*.txt"]
"sako.tui" = ["*.tcss"]
