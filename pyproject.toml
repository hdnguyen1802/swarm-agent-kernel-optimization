[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sako"
version = "0.1.0"
description = "Swarm Agent Kernel Optimization: measured CUDA search for model inference."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = ["torch==2.5.1", "transformers==4.48.3", "ninja>=1.11", "numpy==1.26.4", "accelerate==1.3.0"]
agent = ["google-genai>=1.0,<2", "google-auth>=2.0,<3"]

[project.scripts]
sako = "sako.cli:main"

[tool.setuptools.packages.find]
include = ["sako*"]

[tool.setuptools.package-data]
sako = ["prompts/*.txt"]
